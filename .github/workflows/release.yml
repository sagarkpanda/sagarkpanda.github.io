name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "README.MD"
      - ".gitignore"
      - "LICENSE"
      - "License"
      - ".gitattributes"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/snyk-security.yml"
      - ".github/workflows/svltpages-branch.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release
